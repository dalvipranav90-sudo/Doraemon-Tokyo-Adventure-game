<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doraemon: Tokyo Adventure">
<meta name="theme-color" content="#1e88e5">
<title>Doraemon: Tokyo Adventure</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: #0f1b2d; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden; overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { display: block; background: #6ec6ff; border-radius: 6px; }
  #hint { display: none; margin-top: 14px; font-size: 14px; opacity: .8; text-align: center; padding: 0 20px; }
  @media (orientation: portrait) { #hint { display: block; } }
  .pad { position: fixed; bottom: calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 14px; }
  #padL { left: 14px; } #padR { right: 14px; }
  .pad button {
    width: 76px; height: 76px; border-radius: 50%; border: 3px solid rgba(255,255,255,.7);
    background: rgba(30,136,229,.45); color: #fff; font-size: 30px; line-height: 1;
    touch-action: none; backdrop-filter: blur(2px);
  }
  .pad button.on { background: rgba(253,216,53,.75); color: #222; }
  #bj { width: 92px; height: 92px; }
  #musicBtn { position: fixed; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,.7); background: rgba(30,136,229,.45); color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 100; }
  #musicBtn:active { background: rgba(253,216,53,.75); }
</style>
</head>
<body>
<button id="musicBtn" title="Toggle Music">🔊</button>
<canvas id="c"></canvas>
<div id="hint">Hold phone landscape for a bigger game view</div>
<div class="pad" id="padL"><button id="bl">◀</button><button id="br">▶</button></div>
<div class="pad" id="padR"><button id="bj">▲</button></div>

<!-- Background Music Audio -->
<audio id="bgMusic" loop preload="auto">
  <source src="doraemon-bgm.mp3" type="audio/mpeg">
</audio>

<script>
// ══════════════ Music System ══════════════
var bgMusic = document.getElementById('bgMusic');
var musicEnabled = true;
bgMusic.volume = 0.35; // Soft volume

function playBackgroundMusic() {
  try {
    bgMusic.play().catch(function(e) {
      console.log('Autoplay blocked, user will start music manually');
    });
  } catch (e) {}
}

function toggleMusic() {
  musicEnabled = !musicEnabled;
  var btn = document.getElementById('musicBtn');
  
  if (musicEnabled) {
    bgMusic.volume = 0.35;
    bgMusic.play().catch(function(e) {});
    btn.textContent = '🔊';
  } else {
    bgMusic.pause();
    btn.textContent = '🔇';
  }
}

// Ensure music loops
bgMusic.addEventListener('ended', function() {
  if (musicEnabled) {
    bgMusic.currentTime = 0;
    bgMusic.play();
  }
});

// ══════════════ Settings ══════════════
var TS = 32, VW = 640, VH = 352, ROWS = 11, LEN = 160, GY = 9, G = 0.5;
var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var S = 1;

var grid, mice, items, decor, pops, p, cam, cpI, cps = [62, 96];
var phase = 'idle', score = 0, lives = 3, best = 0, tick = 0;
var keys = { l: 0, r: 0, j: 0 }, jumpEdge = false;
var PITS = [[26, 29], [52, 55], [78, 81], [104, 107]];
var DOOR_X = (LEN - 8) * TS;

// Sound Effects
var AC;
function sfx(f, d, type) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    var o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square'; o.frequency.value = f; g.gain.value = 0.04;
    o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}

// ══════════════ Level Setup ══════════════
function inPit(x) { return PITS.some(function(q) { return x >= q[0] && x < q[1]; }); }
function nearPit(x, w) {
  for (var i = x - 1; i <= x + w + 1; i++) if (inPit(i)) return true;
  return false;
}

function buildLevel() {
  grid = [];
  for (var r = 0; r < ROWS; r++) { grid.push([]); for (var c = 0; c < LEN; c++) grid[r].push(' '); }
  for (var x = 0; x < LEN; x++) if (!inPit(x)) { grid[9][x] = '#'; grid[10][x] = '#'; }
  function put(x, y, ch) { grid[y][x] = ch; }

  put(10, 6, 'B'); put(11, 6, '?'); put(12, 6, 'B'); put(13, 6, '?'); put(14, 6, 'B');
  put(20, 8, 'S'); put(20, 7, 'S');
  var hs = [1, 2, 3, 4, 4, 3, 2, 1];
  hs.forEach(function(h, i) { for (var k = 0; k < h; k++) put(36 + i, 8 - k, 'S'); });
  put(46, 6, '?'); put(47, 6, 'B');
  put(53, 7, 'B');
  [60, 61, 62, 63].forEach(function(x) { put(x, 6, 'B'); });
  [62, 63, 64, 65].forEach(function(x) { put(x, 3, 'B'); });
  put(64, 3, '?');
  put(69, 6, '?'); put(70, 6, 'B'); put(71, 6, '?');
  put(84, 8, 'S'); put(84, 7, 'S');
  put(87, 8, 'S'); put(87, 7, 'S'); put(87, 6, 'S');
  put(92, 6, 'B'); put(93, 6, '?'); put(94, 6, 'B');
  put(105, 7, 'B');
  put(112, 6, 'B'); put(113, 6, 'B'); put(114, 6, '?');
  put(122, 8, 'S'); put(123, 8, 'S'); put(123, 7, 'S');
  put(130, 6, '?'); put(131, 6, 'B'); put(132, 6, '?');

  mice = [];
  [16, 24, 33, 46, 50, 58, 66, 72, 90, 96, 100, 110, 118, 126, 134, 140].forEach(function(tx) {
    mice.push({ x: tx * TS, y: GY * TS - 22, w: 26, h: 22, vx: -0.7, alive: true, t: 0 });
  });

  items = [];
  function coin(tx, ty) { items.push({ x: tx * TS + 16, y: ty * TS + 16, got: false, ph: Math.random() * 6 }); }
  [4, 5, 6, 7].forEach(function(x) { coin(x, 8); });
  [10, 11, 12, 13, 14].forEach(function(x) { coin(x, 5); });
  [[25, 7], [26, 6], [27, 5], [28, 6], [29, 7]].forEach(function(a) { coin(a[0], a[1]); });
  [38, 39, 40, 41].forEach(function(x) { coin(x, 3); });
  [[52, 7], [53, 6], [54, 6], [55, 7]].forEach(function(a) { coin(a[0], a[1]); });
  [60, 61, 62, 63].forEach(function(x) { coin(x, 5); });
  [62, 63, 64, 65].forEach(function(x) { coin(x, 2); });
  [69, 70, 71].forEach(function(x) { coin(x, 5); });
  [[77, 7], [78, 6], [79, 5], [80, 6], [81, 7]].forEach(function(a) { coin(a[0], a[1]); });
  [92, 93, 94].forEach(function(x) { coin(x, 5); });
  [[103, 7], [104, 6], [105, 6], [106, 6], [107, 7]].forEach(function(a) { coin(a[0], a[1]); });
  [112, 113, 114].forEach(function(x) { coin(x, 5); });
  [120, 121, 122, 123, 124, 125].forEach(function(x) { coin(x, 8); });
  [130, 131, 132].forEach(function(x) { coin(x, 5); });
  [142, 143, 144, 145, 146].forEach(function(x) { coin(x, 8); });

  decor = [];
  var types = [['house', 5], ['tree', 2], ['vend', 1], ['lamp', 1], ['torii', 3], ['house', 5], ['pole', 1], ['tree', 2], ['lamp', 1], ['vend', 1]];
  var cur = 1, k = 0;
  while (cur < LEN - 10) {
    var t = types[k % types.length]; k++;
    if (nearPit(cur, t[1])) { cur++; continue; }
    decor.push({ type: t[0], x: cur * TS, w: t[1] * TS, v: k });
    cur += t[1] + 2;
  }
}

function solid(tx, ty) {
  if (tx < 0 || tx >= LEN) return true;
  if (ty < 0 || ty >= ROWS) return false;
  return '#BS?E'.indexOf(grid[ty][tx]) >= 0;
}

// ══════════════ Game Start / Respawn ══════════════
function newGame() {
  buildLevel();
  score = 0; lives = 3; cpI = -1; pops = [];
  p = { x: 2 * TS, y: GY * TS - 30, w: 24, h: 30, vx: 0, vy: 0, face: 1, ground: true, heliOn: false, heliT: 70, heli: false, frame: 0, inv: 0 };
  cam = 0; phase = 'run';
  playBackgroundMusic();
}

function respawn() {
  var cx = cpI >= 0 ? cps[cpI] * TS : 2 * TS;
  p.x = cx; p.y = GY * TS - 30; p.vx = 0; p.vy = 0; p.inv = 90; p.heliOn = false; p.heliT = 70;
}

function hurt() {
  lives--; sfx(160, 0.35, 'sawtooth');
  if (lives <= 0) { phase = 'over'; best = Math.max(best, score); return; }
  respawn();
}

// ══════════════ Physics ══════════════
function moveX() {
  p.x += p.vx;
  var t = Math.floor(p.y / TS), b = Math.floor((p.y + p.h - 1) / TS), ty, tx;
  if (p.vx > 0) {
    tx = Math.floor((p.x + p.w) / TS);
    for (ty = t; ty <= b; ty++) if (solid(tx, ty)) { p.x = tx * TS - p.w; p.vx = 0; break; }
  } else if (p.vx < 0) {
    tx = Math.floor(p.x / TS);
    for (ty = t; ty <= b; ty++) if (solid(tx, ty)) { p.x = (tx + 1) * TS; p.vx = 0; break; }
  }
}

function bump(tx, ty) {
  if (grid[ty][tx] === '?') {
    grid[ty][tx] = 'E'; score++; sfx(880, 0.15);
    pops.push({ x: tx * TS + 16, y: ty * TS, t: 0 });
  } else { sfx(200, 0.06); }
}

function moveY() {
  p.y += p.vy; p.ground = false;
  var l = Math.floor(p.x / TS), r = Math.floor((p.x + p.w - 1) / TS), tx, ty;
  if (p.vy > 0) {
    ty = Math.floor((p.y + p.h) / TS);
    for (tx = l; tx <= r; tx++) if (solid(tx, ty)) { p.y = ty * TS - p.h; p.vy = 0; p.ground = true; break; }
  } else if (p.vy < 0) {
    ty = Math.floor(p.y / TS);
    var cxT = (p.x + p.w / 2) / TS, best = -1, bd = 99;
    for (tx = l; tx <= r; tx++) if (solid(tx, ty)) { var d = Math.abs(tx + 0.5 - cxT); if (d < bd) { bd = d; best = tx; } }
    if (best >= 0) { p.y = (ty + 1) * TS; p.vy = 0; bump(best, ty); }
  }
}

function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

function update() {
  tick++;
  if (phase !== 'run') {
    if (jumpEdge) { jumpEdge = false; newGame(); }
    return;
  }
  var ax = keys.r - keys.l;
  if (ax) { p.vx += ax * 0.45; p.face = ax; } else { p.vx *= 0.8; if (Math.abs(p.vx) < 0.1) p.vx = 0; }
  p.vx = Math.max(-3.2, Math.min(3.2, p.vx));

  if (jumpEdge) {
    jumpEdge = false;
    if (p.ground) { p.vy = -10.4; p.ground = false; sfx(520, 0.12); }
    else if (p.heliT > 0) { p.heliOn = true; }
  }
  if (!keys.j && p.vy < -4) p.vy = -4;
  p.vy += G;
  p.heli = false;
  if (!p.ground && p.heliOn && keys.j && p.vy > 0 && p.heliT > 0) { p.vy = Math.min(p.vy, 1.3); p.heli = true; p.heliT--; }
  if (p.vy > 11) p.vy = 11;

  moveX(); moveY();
  if (p.ground) { p.heliOn = false; p.heliT = 70; }
  p.frame += Math.abs(p.vx);
  if (p.inv > 0) p.inv--;

  for (var i = 0; i < cps.length; i++) if (i > cpI && p.x > cps[i] * TS) cpI = i;

  items.forEach(function(it) {
    if (!it.got && Math.abs(it.x - (p.x + p.w / 2)) < 18 && Math.abs(it.y - (p.y + p.h / 2)) < 20) {
      it.got = true; score++; sfx(990, 0.08);
    }
  });

  mice.forEach(function(e) {
    if (!e.alive) { e.t++; return; }
    if (e.x < cam - 80 || e.x > cam + VW + 160) return;
    e.x += e.vx;
    var front = e.vx > 0 ? e.x + e.w : e.x;
    var tx = Math.floor(front / TS), ty = Math.floor((e.y + e.h - 1) / TS);
    if (solid(tx, ty) || !solid(tx, ty + 1)) { e.vx = -e.vx; e.x += e.vx * 2; }
    if (overlap(p, e)) {
      if (p.vy > 0.5 && (p.y + p.h) - e.y < 18) { e.alive = false; p.vy = -7; score += 2; sfx(300, 0.1); }
      else if (p.inv <= 0) hurt();
    }
  });

  pops.forEach(function(q) { q.t++; q.y -= 1.2; });
  pops = pops.filter(function(q) { return q.t < 30; });

  if (p.y > VH + 80) hurt();

  if (p.x + p.w > DOOR_X && p.x < DOOR_X + 36) { phase = 'win'; best = Math.max(best, score); sfx(1200, 0.4, 'triangle'); }

  var target = Math.max(0, Math.min(LEN * TS - VW, p.x - VW * 0.4));
  cam += (target - cam) * 0.12;
}

// ══════════════ Rendering ══════════════
function oval(x, y, rx, ry, col, line) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 6.2832);
  ctx.fillStyle = col; ctx.fill();
  if (line) { ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.stroke(); }
}

var SKY_W = 1280, bld = [], seed = 7;
function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
(function() { var sx = 0; while (sx < SKY_W) { var w = 30 + Math.floor(rnd() * 40), h = 40 + Math.floor(rnd() * 90); bld.push({ x: sx, w: w, h: h, c: rnd() }); sx += w; } })();
var clouds = [{ x: 60, y: 40, s: 1 }, { x: 330, y: 70, s: 0.8 }, { x: 560, y: 34, s: 1.2 }, { x: 820, y: 62, s: 0.9 }, { x: 1080, y: 30, s: 1.1 }];

function drawBackground(now) {
  var g = ctx.createLinearGradient(0, 0, 0, 290);
  g.addColorStop(0, '#5ab8f5'); g.addColorStop(1, '#d6f1ff');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  oval(548, 58, 24, 24, '#ff5a4d');
  var cw = 1400, off = -((cam * 0.08 + now * 0.01) % cw);
  for (var k = 0; k < 3; k++) clouds.forEach(function(c) {
    var x = off + k * cw + c.x; if (x < -100 || x > VW + 100) return;
    ctx.fillStyle = 'rgba(255,255,255,.92)';
    oval(x, c.y, 26 * c.s, 11 * c.s, 'rgba(255,255,255,.92)');
    oval(x - 16 * c.s, c.y + 3, 16 * c.s, 8 * c.s, 'rgba(255,255,255,.92)');
    oval(x + 18 * c.s, c.y + 4, 18 * c.s, 8 * c.s, 'rgba(255,255,255,.92)');
  });
  var fp = 1000, fo = -((cam * 0.12) % fp);
  for (var f = 0; f < 3; f++) {
    var fx = fo + f * fp + 420;
    ctx.fillStyle = '#7d96c4';
    ctx.beginPath(); ctx.moveTo(fx - 300, 292); ctx.lineTo(fx - 50, 150); ctx.lineTo(fx + 50, 150); ctx.lineTo(fx + 300, 292); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f4f8ff';
    ctx.beginPath(); ctx.moveTo(fx - 50, 150); ctx.lineTo(fx + 50, 150); ctx.lineTo(fx + 88, 178); ctx.lineTo(fx + 55, 172); ctx.lineTo(fx + 25, 188); ctx.lineTo(fx, 174); ctx.lineTo(fx - 28, 190); ctx.lineTo(fx - 52, 172); ctx.lineTo(fx - 88, 178); ctx.closePath(); ctx.fill();
  }
  var so = -((cam * 0.3) % SKY_W);
  for (var s = 0; s < 3; s++) {
    var bx = so + s * SKY_W;
    if (bx > VW || bx + SKY_W < 0) continue;
    bld.forEach(function(b) {
      var x = bx + b.x; if (x > VW || x + b.w < 0) return;
      var sh = Math.floor(150 + b.c * 40);
      ctx.fillStyle = 'rgb(' + (sh - 30) + ',' + (sh - 10) + ',' + (sh + 25) + ')';
      ctx.fillRect(x, 292 - b.h, b.w - 2, b.h);
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      for (var wy = 292 - b.h + 6; wy < 284; wy += 10) for (var wx = x + 4; wx < x + b.w - 8; wx += 9) ctx.fillRect(wx, wy, 4, 5);
    });
    var tx = bx + 330;
    ctx.fillStyle = '#e8532f';
    ctx.beginPath(); ctx.moveTo(tx - 30, 292); ctx.lineTo(tx - 4, 292 - 120); ctx.lineTo(tx - 1.5, 292 - 185); ctx.lineTo(tx + 1.5, 292 - 185); ctx.lineTo(tx + 4, 292 - 120); ctx.lineTo(tx + 30, 292); ctx.lineTo(tx + 20, 292); ctx.lineTo(tx, 292 - 70); ctx.lineTo(tx - 20, 292); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.fillRect(tx - 12, 292 - 60, 24, 4); ctx.fillRect(tx - 7, 292 - 95, 14, 4); ctx.fillRect(tx - 3, 292 - 150, 6, 4);
    ctx.fillStyle = '#e8532f'; ctx.fillRect(tx - 11, 292 - 118, 22, 8);
    var kx = bx + 930;
    ctx.fillStyle = '#c9d6e8';
    ctx.beginPath(); ctx.moveTo(kx - 8, 292); ctx.lineTo(kx - 2.5, 292 - 200); ctx.lineTo(kx - 1, 292 - 230); ctx.lineTo(kx + 1, 292 - 230); ctx.lineTo(kx + 2.5, 292 - 200); ctx.lineTo(kx + 8, 292); ctx.closePath(); ctx.fill();
    oval(kx, 292 - 165, 9, 3.5, '#b3c3da'); oval(kx, 292 - 190, 6, 3, '#b3c3da');
  }
}

function drawDecor(d) {
  var x = d.x - cam, base = GY * TS;
  if (x > VW + 40 || x + d.w < -40) return;
  var i;
  if (d.type === 'house') {
    var wall = d.v % 2 ? '#f3e7cd' : '#ead9b5', roof = d.v % 2 ? '#3d4a63' : '#5a3d3d';
    ctx.fillStyle = wall; ctx.fillRect(x + 8, base - 72, d.w - 16, 72);
    ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(x + 8, base - 22, d.w - 16, 22);
    ctx.fillStyle = roof;
    ctx.beginPath(); ctx.moveTo(x - 4, base - 66); ctx.lineTo(x + d.w + 4, base - 66); ctx.lineTo(x + d.w - 22, base - 104); ctx.lineTo(x + 22, base - 104); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1;
    for (i = 1; i < 4; i++) { ctx.beginPath(); ctx.moveTo(x + 22 - i * 6, base - 104 + i * 9.5); ctx.lineTo(x + d.w - 22 + i * 6, base - 104 + i * 9.5); ctx.stroke(); }
    ctx.fillStyle = '#7a4b2a'; ctx.fillRect(x + 22, base - 42, 24, 42);
    oval(x + 42, base - 20, 1.6, 1.6, '#fdd835');
    ctx.fillStyle = '#fffbe9'; ctx.fillRect(x + 76, base - 56, 56, 34);
    ctx.strokeStyle = '#7a4b2a'; ctx.lineWidth = 2; ctx.strokeRect(x + 76, base - 56, 56, 34);
    ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x + 104, base - 56); ctx.lineTo(x + 104, base - 22); ctx.moveTo(x + 76, base - 39); ctx.lineTo(x + 132, base - 39); ctx.stroke();
    oval(x + 14, base - 48, 5, 7, '#e53935', '#7a1b1b');
  } else if (d.type === 'tree') {
    ctx.fillStyle = '#6b4a2f'; ctx.fillRect(x + 28, base - 46, 7, 46);
    oval(x + 31, base - 62, 24, 16, '#f7b6cf'); oval(x + 18, base - 52, 15, 11, '#f4a3c2'); oval(x + 45, base - 54, 15, 11, '#f9c4d9');
    oval(x + 30, base - 72, 12, 8, '#fbd3e2');
  } else if (d.type === 'torii') {
    ctx.fillStyle = '#d32f2f';
    ctx.fillRect(x + 16, base - 70, 8, 70); ctx.fillRect(x + d.w - 24, base - 70, 8, 70);
    ctx.fillRect(x + 20, base - 54, d.w - 40, 6);
    ctx.fillStyle = '#212121'; ctx.fillRect(x + 6, base - 78, d.w - 12, 8);
    ctx.fillStyle = '#d32f2f'; ctx.fillRect(x + 10, base - 82, d.w - 20, 5);
  } else if (d.type === 'vend') {
    var col = d.v % 2 ? '#e53935' : '#1e88e5';
    ctx.fillStyle = col; ctx.fillRect(x + 1, base - 46, 30, 46);
    ctx.fillStyle = '#fff6c9'; ctx.fillRect(x + 5, base - 40, 22, 22);
    ctx.fillStyle = '#263238'; ctx.fillRect(x + 8, base - 12, 16, 5);
    for (i = 0; i < 4; i++) oval(x + 9 + i * 5, base - 29, 1.8, 4, ['#ef5350', '#66bb6a', '#42a5f5', '#ffa726'][i]);
  } else if (d.type === 'lamp') {
    ctx.fillStyle = '#4b5563'; ctx.fillRect(x + 14, base - 70, 3, 70); ctx.fillRect(x + 14, base - 70, 14, 3);
    oval(x + 28, base - 66, 5, 3.5, '#ffe082');
  } else if (d.type === 'pole') {
    ctx.fillStyle = '#6b5236'; ctx.fillRect(x + 14, base - 100, 5, 100);
    ctx.fillRect(x + 4, base - 94, 25, 3); ctx.fillRect(x + 7, base - 84, 19, 3);
    ctx.strokeStyle = 'rgba(40,40,40,.6)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x + 4, base - 93); ctx.quadraticCurveTo(x + 90, base - 78, x + 160, base - 93); ctx.stroke();
  }
}

function drawTile(ch, x, y, tx, ty) {
  if (ch === '#') {
    if (ty === GY) {
      ctx.fillStyle = '#c9ccd4'; ctx.fillRect(x, y, TS, 7);
      ctx.fillStyle = '#9ea3ae'; ctx.fillRect(x, y + 7, TS, 2);
      ctx.fillStyle = '#4b505b'; ctx.fillRect(x, y + 9, TS, TS - 9);
    } else {
      ctx.fillStyle = '#434853'; ctx.fillRect(x, y, TS, TS);
      if (tx % 2 === 0) { ctx.fillStyle = '#f5f5f0'; ctx.fillRect(x + 4, y + 12, 24, 4); }
    }
  } else if (ch === 'B') {
    ctx.fillStyle = '#c8643c'; ctx.fillRect(x, y, TS, TS);
    ctx.strokeStyle = '#7a3a20'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, TS - 2, TS - 2);
    ctx.beginPath(); ctx.moveTo(x, y + 16); ctx.lineTo(x + TS, y + 16); ctx.moveTo(x + 16, y); ctx.lineTo(x + 16, y + 16); ctx.moveTo(x + 8, y + 16); ctx.lineTo(x + 8, y + TS); ctx.moveTo(x + 24, y + 16); ctx.lineTo(x + 24, y + TS); ctx.stroke();
  } else if (ch === '?') {
    var pulse = 0.5 + 0.5 * Math.sin(tick / 10);
    ctx.fillStyle = pulse > 0.5 ? '#ffd23f' : '#ffc107'; ctx.fillRect(x, y, TS, TS);
    ctx.strokeStyle = '#a86a00'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, TS - 2, TS - 2);
    ctx.fillStyle = '#7a4b00'; ctx.font = 'bold 22px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('?', x + 16, y + 24);
  } else if (ch === 'E') {
    ctx.fillStyle = '#8b7a66'; ctx.fillRect(x, y, TS, TS);
    ctx.strokeStyle = '#5a4c3c'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, TS - 2, TS - 2);
  } else if (ch === 'S') {
    ctx.fillStyle = '#9aa3ad'; ctx.fillRect(x, y, TS, TS);
    ctx.fillStyle = '#b9c1ca'; ctx.fillRect(x, y, TS, 5);
    ctx.strokeStyle = '#5f6872'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, TS - 2, TS - 2);
    oval(x + 6, y + 8, 1.6, 1.6, '#5f6872'); oval(x + 26, y + 8, 1.6, 1.6, '#5f6872');
  }
}

function drawDorayaki(x, y, ph, now) {
  var by = y + Math.sin(now / 250 + ph) * 2;
  oval(x, by, 8.5, 7.5, '#b8651b', '#6b3a10');
  oval(x, by, 6, 5.2, '#d98a32');
  oval(x - 2.5, by - 2.5, 2.8, 1.6, '#f2c27a');
}

function drawMouse(e) {
  if (!e.alive && e.t > 25) return;
  var x = e.x + e.w / 2 - cam, y = e.y + e.h;
  ctx.save(); ctx.translate(x, y); ctx.scale(e.vx >= 0 ? 1 : -1, e.alive ? 1 : 0.3);
  var step = Math.sin(tick * 0.4) * 1.5;
  ctx.strokeStyle = '#d98ca5'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-10, -7); ctx.quadraticCurveTo(-18, -4, -19, -13); ctx.stroke();
  oval(-5 + step, -1.5, 3.5, 2, '#d98ca5'); oval(6 - step, -1.5, 3.5, 2, '#d98ca5');
  oval(0, -9, 11, 7.5, '#9aa0aa', '#333');
  oval(8, -10, 6, 5, '#a9aeb7', '#333');
  oval(6, -16, 4.2, 4.2, '#f4a7bf', '#333'); oval(11, -15, 3.6, 3.6, '#f4a7bf', '#333');
  oval(13.5, -9.5, 1.6, 1.4, '#e8708f');
  oval(9.5, -11, 1.1, 1.1, '#111');
  ctx.restore();
}

function drawDora(now) {
  if (p.inv > 0 && Math.floor(p.inv / 5) % 2) return;
  ctx.save(); ctx.translate(p.x + p.w / 2 - cam, p.y + p.h); ctx.scale(p.face >= 0 ? 1 : -1, 1);
  var walk = p.ground && Math.abs(p.vx) > 0.3 ? Math.sin(p.frame * 0.5) : 0;
  oval(-11, -8, 2.6, 2.6, '#e53935', '#222');
  oval(-5 + walk * 2, -2, 5, 2.6, '#fff', '#222'); oval(5 - walk * 2, -2, 5, 2.6, '#fff', '#222');
  oval(0, -10, 9, 8, '#1e88e5', '#14233a');
  oval(0, -9, 6.2, 5.8, '#fff');
  ctx.beginPath(); ctx.arc(0, -10, 3.8, 0.05 * Math.PI, 0.95 * Math.PI); ctx.strokeStyle = '#444'; ctx.lineWidth = 1; ctx.stroke();
  oval(-9, -11 + walk, 2.8, 2.8, '#fff', '#222'); oval(9, -11 - walk, 2.8, 2.8, '#fff', '#222');
  oval(0, -22, 10, 9.5, '#1e88e5', '#14233a');
  ctx.fillStyle = '#e53935'; ctx.fillRect(-7, -17, 14, 3);
  oval(0, -14.2, 2.4, 2.4, '#fdd835', '#222');
  oval(1, -20.5, 7.6, 7.2, '#fff');
  oval(-1.2, -25.3, 2.3, 3, '#fff', '#222'); oval(3.6, -25.3, 2.3, 3, '#fff', '#222');
  oval(-0.4, -25, 0.9, 1.1, '#111'); oval(4.4, -25, 0.9, 1.1, '#111');
  oval(1.5, -22, 1.9, 1.9, '#e53935', '#222');
  ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(1.5, -20.1); ctx.lineTo(1.5, -18); ctx.stroke();
  ctx.beginPath(); ctx.arc(1.5, -19.2, 5, 0.2 * Math.PI, 0.8 * Math.PI); ctx.stroke();
  for (var sg = -1; sg <= 1; sg += 2) for (var w = -1; w <= 1; w++) {
    ctx.beginPath(); ctx.moveTo(1.5 + sg * 3.5, -20.4 + w * 1.4); ctx.lineTo(1.5 + sg * 8.8, -21.2 + w * 3); ctx.stroke();
  }
  if (p.heli) {
    ctx.strokeStyle = '#8d6e3f'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(0, -31.5); ctx.lineTo(0, -35.5); ctx.stroke();
    oval(0, -36.5, 3 + 11 * Math.abs(Math.cos(now / 35)), 1.8, '#fdd835', '#8d6e3f');
  }
  ctx.restore();
}

function drawDoor(now) {
  var x = DOOR_X - cam, y = GY * TS - 52;
  if (x > VW + 40 || x < -60) return;
  ctx.fillStyle = '#c2185b'; ctx.fillRect(x - 3, y - 3, 40, 55);
  ctx.fillStyle = '#ff6fa8'; ctx.fillRect(x, y, 34, 52);
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x + 4, y + 4, 11, 44);
  oval(x + 27, y + 28, 2.5, 2.5, '#fdd835', '#8a6d00');
  for (var i = 0; i < 4; i++) {
    var a = now / 400 + i * 1.6;
    oval(x + 17 + Math.cos(a) * 24, y + 20 + Math.sin(a) * 22, 1.8, 1.8, 'rgba(255,255,200,.9)');
  }
}

function drawHUD() {
  drawDorayaki(18, 20, 0, 0);
  ctx.fillStyle = '#fff'; ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 3;
  ctx.font = 'bold 18px system-ui, sans-serif'; ctx.textAlign = 'left';
  ctx.strokeText('x ' + score, 32, 26); ctx.fillText('x ' + score, 32, 26);
  ctx.textAlign = 'right';
  var hearts = ''; for (var i = 0; i < lives; i++) hearts += '♥ ';
  ctx.fillStyle = '#ff4d5e';
  ctx.strokeText(hearts, VW - 12, 26); ctx.fillText(hearts, VW - 12, 26);
}

function banner(t1, t2, t3) {
  ctx.fillStyle = 'rgba(15,27,45,.72)'; ctx.fillRect(0, 0, VW, VH);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = 'bold 36px system-ui, sans-serif'; ctx.fillText(t1, VW / 2, 130);
  ctx.font = '500 18px system-ui, sans-serif'; ctx.fillText(t2, VW / 2, 170);
  ctx.font = '400 14px system-ui, sans-serif'; ctx.fillStyle = '#cfe6ff'; ctx.fillText(t3, VW / 2, 206);
}

function draw(now) {
  ctx.setTransform(S, 0, 0, S, 0, 0);
  if (!p) { newGame(); phase = 'idle'; }
  drawBackground(now);
  decor.forEach(drawDecor);
  var c0 = Math.floor(cam / TS), ty, tx;
  for (tx = c0; tx <= c0 + 21; tx++) for (ty = 0; ty < ROWS; ty++) {
    if (tx >= LEN) continue;
    var ch = grid[ty][tx]; if (ch !== ' ') drawTile(ch, tx * TS - Math.round(cam), ty * TS, tx, ty);
  }
  drawDoor(now);
  items.forEach(function(it) { if (!it.got) { var x = it.x - cam; if (x > -20 && x < VW + 20) drawDorayaki(x, it.y, it.ph, now); } });
  pops.forEach(function(q) { drawDorayaki(q.x - cam, q.y, 0, now); });
  mice.forEach(drawMouse);
  drawDora(now);
  drawHUD();
  if (phase === 'idle') banner('Doraemon: Tokyo Adventure', 'Tap to start', '◀ ▶ Move   ▲ Jump   Hold ▲ again = Take-copter');
  if (phase === 'over') banner('Game Over', 'Dorayaki: ' + score + '   Best: ' + best, 'Tap to play again');
  if (phase === 'win') banner('Anywhere Door!', 'Dorayaki: ' + score + '   Best: ' + best, 'Tap to play again');
}

var last = 0, acc = 0;
function loop(ts) {
  var dt = Math.min(50, ts - last); last = ts; acc += dt;
  while (acc >= 16.67) { update(); acc -= 16.67; }
  draw(ts);
  requestAnimationFrame(loop);
}

function setKey(k, v) {
  if (k === 'j') { if (v && !keys.j) jumpEdge = true; keys.j = v; }
  else keys[k] = v;
}
window.addEventListener('keydown', function(e) {
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a') setKey('l', 1);
  if (k === 'ArrowRight' || k === 'd') setKey('r', 1);
  if (k === 'ArrowUp' || k === 'w' || k === ' ' || k === 'Enter') setKey('j', 1);
  if (k.indexOf('Arrow') === 0 || k === ' ') e.preventDefault();
});
window.addEventListener('keyup', function(e) {
  var k = e.key;
  if (k === 'ArrowLeft' || k === 'a') setKey('l', 0);
  if (k === 'ArrowRight' || k === 'd') setKey('r', 0);
  if (k === 'ArrowUp' || k === 'w' || k === ' ' || k === 'Enter') setKey('j', 0);
});
function bindBtn(id, k) {
  var b = document.getElementById(id);
  function on(e) { e.preventDefault(); setKey(k, 1); b.className = 'on'; try { b.setPointerCapture(e.pointerId); } catch (x) {} }
  function off(e) { e.preventDefault(); setKey(k, 0); b.className = ''; }
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('contextmenu', function(e) { e.preventDefault(); });
}
bindBtn('bl', 'l'); bindBtn('br', 'r'); bindBtn('bj', 'j');
canvas.addEventListener('pointerdown', function() { if (phase !== 'run') jumpEdge = true; });
document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

document.getElementById('musicBtn').addEventListener('click', toggleMusic);

// Play music on first user interaction (due to autoplay policy)
document.addEventListener('click', function() {
  if (bgMusic.paused && musicEnabled) {
    bgMusic.play().catch(function(e) {});
  }
}, { once: true });

function resize() {
  var w = window.innerWidth, h = window.innerHeight;
  var cw = Math.min(w, h * VW / VH), ch = cw * VH / VW;
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  var dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  S = canvas.width / VW;
}
window.addEventListener('resize', resize);

resize();
buildLevel();
p = { x: 2 * TS, y: GY * TS - 30, w: 24, h: 30, vx: 0, vy: 0, face: 1, ground: true, heliOn: false, heliT: 70, heli: false, frame: 0, inv: 0 };
cam = 0; pops = []; cpI = -1;
requestAnimationFrame(loop);
</script>
</body>
